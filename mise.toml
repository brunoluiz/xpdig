[tools]
go = "1.26.4"
goreleaser = "2.5.0"
gofumpt = "0.12.0"
golangci-lint = "2.14.0"

[tasks.ci]
description = "Run linting, formatting, vetting, tests, module tidy, and build"
run = [
  "gofumpt -l -w .",
  "golangci-lint run ./...",
  "go vet ./...",
  "go test -race -cover ./...",
  "go mod tidy",
  "go build ./...",
]

[tasks.release]
description = "Create a release with GoReleaser"
run = "goreleaser release --clean"
